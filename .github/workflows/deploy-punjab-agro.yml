name: Deploy Punjab Agro Dashboard

on:
  push:
    branches: [main]
    paths:
      - "punjab-agro-analytics/**"
      - ".github/workflows/deploy-punjab-agro.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "punjab-agro-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas plotly

      - name: Build static dashboard
        run: python punjab-agro-analytics/scripts/build_static_site.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: punjab-agro-analytics/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
